<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transições entre páginas · Controle de jornada AGT LOG</title>
<style>
:root{--ink:#381E42;--muted:#6E6274;--line:#E4DFE7;--bg:#F5F3F6;--card:#fff;--mint:#FFCE42;
  --dur:260ms;--ease:cubic-bezier(.2,.8,.2,1);--font:"Segoe UI",system-ui,sans-serif;--mono:Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--font)}
.wrap{max-width:1280px;margin:0 auto;padding:40px 32px 56px}
h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 4px}
.lead{color:var(--muted);margin:0 0 20px}
.bar{display:flex;gap:10px;align-items:center;margin:0 0 28px;flex-wrap:wrap}
.bar button{font:600 14px var(--font);border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:6px;padding:9px 16px;cursor:pointer}
.bar button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:14px}
.card h2{font-size:16px;font-weight:600;margin:0;display:flex;gap:10px;align-items:baseline}
.card h2 b{font:600 13px var(--mono);background:var(--ink);color:var(--mint);border-radius:5px;padding:2px 8px}
.card p{margin:0;color:var(--muted);font-size:14px}
.card.rec{outline:2px solid var(--mint);outline-offset:-1px}
.tag{font-size:12px;font-weight:600;background:var(--mint);color:var(--ink);border-radius:99px;padding:2px 10px;margin-left:auto}

/* ---- mini janela do programa ---- */
.app{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);height:330px;display:flex;flex-direction:column;transition:opacity 140ms linear}
.head{background:var(--card);height:46px;display:flex;align-items:center;gap:6px;padding:0 12px;border-bottom:1px solid var(--line);position:relative;flex:none}
.head img{height:24px;margin-right:6px}
.tab{font:600 12.5px var(--font);color:var(--muted);padding:6px 10px;border-radius:4px;cursor:pointer;user-select:none;position:relative}
.tab.on{color:var(--ink);background:var(--bg)}
.ind{position:absolute;bottom:0;height:3px;background:var(--mint);border-radius:2px;transition:left var(--dur) var(--ease),width var(--dur) var(--ease)}
.no-ind .tab.on{background:var(--bg)}
.btn{margin-left:auto;font:600 11px var(--font);background:var(--ink);color:#fff;border-radius:4px;padding:6px 10px}
.stage{position:relative;flex:1;overflow:hidden}
.page{position:absolute;inset:0;padding:10px;display:flex;gap:10px}
.page.hidden{visibility:hidden}

/* página motoristas */
.side{width:34%;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px}
.side .t{font:700 12px var(--font);margin-bottom:6px}
.side .r{font-size:11px;padding:4px 6px;border-radius:3px;display:flex;justify-content:space-between}
.side .r.sel{background:var(--ink);color:#fff}
.side .r span{font-family:var(--mono);color:inherit;opacity:.8}
.main{flex:1;display:flex;flex-direction:column;gap:8px}
.blk{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.blk .n{font-size:15px}
.blk .s{font-size:10.5px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}
.stats div{font:600 12px var(--mono)}
.stats small{display:block;font:400 9.5px var(--font);color:var(--muted)}
.rows{flex:1;font:11px var(--mono)}
.rows div{display:flex;justify-content:space-between;padding:3px 2px;border-bottom:1px solid var(--line)}

/* página planilha */
.sheetp{flex-direction:column}
.sheet{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.sheet table{border-collapse:collapse;width:100%;font:10.5px var(--mono)}
.sheet th{background:var(--bg);font:600 10px var(--font);color:var(--ink);padding:5px 4px;border:1px solid var(--line)}
.sheet td{border:1px solid var(--line);padding:3px 4px;text-align:center}
.sheet td.l{font-family:var(--font);text-align:left;color:var(--ink)}
.sheet tr.par td{background:#F8F7F9}
.sheet tr.end td{border-bottom:1px solid #B9AFC0}

/* camadas das animações */
.cover{position:absolute;inset:0;background:var(--mint);transform:translateX(-101%);z-index:5;pointer-events:none}
.veil{position:absolute;inset:0;background:var(--bg);z-index:5;pointer-events:none;display:none}
@media (prefers-reduced-motion:reduce){*{transition-duration:0s!important;animation:none!important}}
@media (max-width:900px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Transição entre Motoristas e Planilha do mês</h1>
  <p class="lead">Clique em <b>Motoristas</b> e <b>Planilha do mês</b> dentro de cada janelinha. Todas usam só recursos que o programa (Tkinter) consegue reproduzir.</p>
  <div class="bar">

    <button id="slow">Câmera lenta</button>
    <span>Câmera lenta deixa as animações 4× mais lentas, só para enxergar o movimento.</span>
  </div>
  <div class="grid" id="grid"></div>
</div>

          <tr><td>01</td><td class="l">Período</td><td>05:10 – 17:20</td><td>05:11 – 17:21</td><td>Espera fixa</td></tr>
          <tr><td></td><td class="l">Movimento</td><td>08:40:12</td><td>07:41:12</td><td>00:00:00</td></tr>
          <tr class="end"><td></td><td class="l">HE total</td><td>00:40:12</td><td>00:00:00</td><td>02:00:00</td></tr>
          <tr class="par"><td>02</td><td class="l">Período</td><td>05:12 – 17:22</td><td>Espera fixa</td><td>05:13 – 17:23</td></tr>
          <tr class="par"><td></td><td class="l">Movimento</td><td>09:40:12</td><td>00:00:00</td><td>08:43:12</td></tr>
          <tr class="par end"><td></td><td class="l">HE total</td><td>01:40:12</td><td>02:00:00</td><td>00:43:12</td></tr>
        </table></div>
      </div>
      <div class="cover"></div><div class="veil"></div>
    </div>
  </div>
</template>

<script>
const MODELS=[
 {id:1,name:'Deslizar para o lado',desc:'A página atual sai por um lado e a nova entra pelo outro. Voltando, o movimento inverte.',fx:'slide'},
 {id:2,name:'Cortina amarela',desc:'Uma faixa amarela da marca cobre a página e, ao passar, revela a nova. Conversa com os botões (modelo 3).',fx:'curtain'},
 {id:3,name:'Revelar de cima para baixo',desc:'A página nova “desenrola” do topo até o rodapé.',fx:'reveal'},
 {id:4,name:'Cascata dos blocos',desc:'Os blocos da página nova aparecem um depois do outro, de cima para baixo.',fx:'cascade'},
 {id:5,name:'Esmaecer a janela',desc:'A janela inteira dá uma piscada suave e volta com a página nova (o cabeçalho pisca junto).',fx:'fade'},
 {id:6,name:'Marcador deslizante nas abas',desc:'Uma linha amarela desliza entre as abas; a página troca na hora.',fx:'none',ind:true},
 {id:'6 + 1',name:'Marcador + deslizar',desc:'A linha amarela acompanha a página deslizando.',fx:'slide',ind:true,rec:true},
 {id:'6 + 2',name:'Marcador + cortina amarela',desc:'A linha amarela desliza enquanto a cortina passa.',fx:'curtain',ind:true,rec:true},
];
let SLOW=1;
const dur=ms=>ms*SLOW;
const wait=ms=>new Promise(r=>setTimeout(r,dur(ms)));
const ease='cubic-bezier(.2,.8,.2,1)';
const grid=document.getElementById('grid'),tpl=document.getElementById('tpl');
const apps=[];

MODELS.forEach(m=>{
  const card=document.createElement('div');card.className='card'+(m.rec?' rec':'');
  card.innerHTML=`<div><h2><b>${m.id}</b>${m.name}${m.rec?'<span class="tag">Recomendada</span>':''}</h2><p>${m.desc}</p></div>`;
  const app=tpl.content.firstElementChild.cloneNode(true);card.appendChild(app);grid.appendChild(card);
  const tabs=[...app.querySelectorAll('.tab')],pages=[...app.querySelectorAll('.page')],ind=app.querySelector('.ind');
  const st={cur:0,busy:false};
  if(!m.ind){ind.style.display='none'}
  const placeInd=i=>{const t=tabs[i];ind.style.left=t.offsetLeft+8+'px';ind.style.width=t.offsetWidth-16+'px'};
  requestAnimationFrame(()=>placeInd(0));
  async function go(i){
    if(i===st.cur||st.busy)return;st.busy=true;
    const from=pages[st.cur],to=pages[i],dir=i>st.cur?1:-1;
    tabs.forEach((t,k)=>t.classList.toggle('on',k===i));
    if(m.ind){ind.style.transitionDuration=dur(260)+'ms';placeInd(i)}
    await FX[m.fx](app,from,to,dir);
    st.cur=i;st.busy=false;
  }
  tabs.forEach((t,k)=>t.addEventListener('click',()=>go(k)));
  apps.push({go,st});
});

const FX={
  none:async(app,from,to)=>{from.classList.add('hidden');to.classList.remove('hidden')},
  slide:async(app,from,to,dir)=>{
    const d=dur(260);to.classList.remove('hidden');
    to.style.transition=from.style.transition='none';to.style.transform=`translateX(${dir*100}%)`;from.style.transform='translateX(0)';
    to.offsetWidth;
    to.style.transition=from.style.transition=`transform ${d}ms ${ease}`;
    to.style.transform='translateX(0)';from.style.transform=`translateX(${-dir*100}%)`;
    await wait(260);from.classList.add('hidden');from.style.transform='';to.style.transition=from.style.transition='';
  },
  curtain:async(app,from,to,dir)=>{
    const c=app.querySelector('.cover'),d=dur(170);
    c.style.transition='none';c.style.transform=`translateX(${-dir*101}%)`;c.offsetWidth;
    c.style.transition=`transform ${d}ms ${ease}`;c.style.transform='translateX(0)';
    await wait(170);from.classList.add('hidden');to.classList.remove('hidden');
    c.style.transform=`translateX(${dir*101}%)`;await wait(170);
  },
  reveal:async(app,from,to)=>{
    const d=dur(300);from.classList.add('hidden');to.classList.remove('hidden');
    to.style.transition='none';to.style.clipPath='inset(0 0 100% 0)';to.offsetWidth;
    to.style.transition=`clip-path ${d}ms ${ease}`;to.style.clipPath='inset(0 0 0 0)';
    await wait(300);to.style.clipPath='';to.style.transition='';
  },
  cascade:async(app,from,to)=>{
    from.classList.add('hidden');to.classList.remove('hidden');
    const blocks=[...to.querySelectorAll(':scope > *, :scope .main > *')].filter(b=>!b.classList.contains('main'));
    blocks.forEach(b=>{b.style.transition='none';b.style.clipPath='inset(0 0 100% 0)';b.style.transform='translateY(8px)'});
    to.offsetWidth;
    for(const b of blocks){b.style.transition=`clip-path ${dur(220)}ms ${ease},transform ${dur(220)}ms ${ease}`;b.style.clipPath='inset(0 0 0 0)';b.style.transform='none';await wait(90)}
    await wait(220);blocks.forEach(b=>{b.style.clipPath='';b.style.transform='';b.style.transition=''});
  },
  fade:async(app,from,to)=>{
    app.style.transitionDuration=dur(140)+'ms';app.style.opacity=.72;await wait(140);
    from.classList.add('hidden');to.classList.remove('hidden');app.style.opacity=1;await wait(140);
  },
};

// troca automática para ver todas ao mesmo tempo
let timer=null;
const tick=()=>apps.forEach(a=>a.go(a.st.cur?0:1));
const autoBtn=document.getElementById('auto');
const startAuto=()=>{timer=setInterval(tick,2200*SLOW);autoBtn.classList.add('on');autoBtn.textContent='▶ Trocando sozinho'};
const stopAuto=()=>{clearInterval(timer);timer=null;autoBtn.classList.remove('on');autoBtn.textContent='❚❚ Parado (clique nas abas)'};
autoBtn.onclick=()=>timer?stopAuto():startAuto();
document.getElementById('slow').onclick=e=>{SLOW=SLOW===1?4:1;e.target.classList.toggle('on',SLOW>1);if(timer){stopAuto();startAuto()}};
grid.addEventListener('pointerdown',()=>timer&&stopAuto());
startAuto();
</script>
</body>
</html>
