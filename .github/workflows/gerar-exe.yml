# Gera o .exe no próprio GitHub e anexa ao release. Basta publicar um release com a tag vX.Y.Z
# (igual a VERSION em controle_jornada.py). Enquanto o .exe não está anexado, o programa não
# oferece a atualização (ele só aceita release com .exe).
name: Gerar .exe do release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag do release (ex.: v0.1.9)'
        required: true

permissions:
  contents: write

jobs:
  exe:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Conferir se a versão do código bate com a tag
        shell: bash
        run: |
          grep -q "^VERSION = '${TAG#v}'" controle_jornada.py || { echo "VERSION em controle_jornada.py não é ${TAG#v}"; exit 1; }

      - name: Autoteste das regras
        run: python teste_regras.py

      - name: Gerar o .exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --add-data "logo_agtlog.png;." --add-data "agt_log.ico;." --icon "agt_log.ico" --name "Controle_de_Jornada_AGT_LOG" controle_jornada.py

      - name: Anexar o .exe ao release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/Controle_de_Jornada_AGT_LOG.exe --clobber --repo "${{ github.repository }}"
